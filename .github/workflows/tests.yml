name: Test formula

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew (taps this repository)
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # main

      # The macos-15-intel image ships a preinstalled openssl@1.1 whose
      # bin/openssl symlink blocks linking openssl@3 (a runner quirk, not a
      # formula problem): install the dependencies first and overwrite it.
      - name: Install dependencies
        run: brew install openssl@3 argon2 || brew link --overwrite openssl@3

      - name: Build from source
        run: brew install --build-from-source lf3551/clawsec/clawsec

      - name: brew test (encrypted file transfer on localhost)
        run: brew test lf3551/clawsec/clawsec

      - name: brew audit
        run: brew audit --strict lf3551/clawsec/clawsec
